[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Where installers put the binary: the XDG bin directory, falling back to
# ~/.local/bin (%USERPROFILE%\.local\bin on Windows). Most people installing
# zeldoc have no Rust toolchain, so not ~/.cargo/bin. No "$XDG_DATA_HOME/../bin"
# as uv has: the installer compares PATH entries as text, so with XDG_DATA_HOME
# set it reported ~/.local/bin as missing from PATH and zeldoc as shadowed.
install-path = ["$XDG_BIN_HOME/", "~/.local/bin"]
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
