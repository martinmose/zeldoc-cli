[package]
name = "zeldoc"
version = "0.2.0"
edition = "2024"
description = "Command-line client for Zeldoc.ai"
repository = "https://github.com/martinmose/zeldoc-cli"
license = "MIT"

[dependencies]
# Argument parsing
clap = { version = "4.6", features = ["derive", "env"] }

# HTTP client (pure-Rust rustls-tls, so builds need no system OpenSSL)
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Errors: typed thiserror enums in the services, anyhow only at the command edge
thiserror = "2.0"
anyhow = "1.0"

# Money as exact decimals (prices arrive as decimal strings)
rust_decimal = "1.36"

# Dates in usage reports
chrono = { version = "0.4", default-features = false, features = ["serde"] }

# Utilities
dirs = "6.0"
rpassword = "7.4"

[dev-dependencies]
tempfile = "3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
